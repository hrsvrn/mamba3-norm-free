[project]
name = "mamba-norm-free"
version = "0.1.0"
description = "Normalization-free Mamba-3 ablation research infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.10.*",
    "triton>=3.1.0",
    "mamba-ssm==2.3.2.post1",
    "causal-conv1d>=1.4.0",
    "flash-linear-attention>=0.5.0",
    "transformers>=4.50.0",
    "datasets>=4.0.0",
    "tiktoken>=0.11.0",
    "einops>=0.8.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0.0",
    "wandb>=0.18.0",
    "lm-eval>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.2.post1/mamba_ssm-2.3.2.post1+cu12torch2.10cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
