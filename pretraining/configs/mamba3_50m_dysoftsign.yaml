# =============================================================================
# Mamba-3 50M parameter ablation: DySoftSign in place of BCNorm
# Target: 1B tokens of FineWebEdu, single H100 (or DDP-ready)
#
# Architecture identical to mamba3_50m.yaml (BCNorm baseline) except:
#   architecture.bc_stabilizer: dysoftsign
#
# DySoftSign:  y = x / (beta + alpha * |x|)
#   - alpha, beta are per-channel learnable, log-parameterised (always >0)
#   - replaces BCNorm's RMSNormGated(d_state) at the B/C path
#   - element-wise: no global reduction -> no thread-block sync in decode
#
# This is the *ablation* run. Compare ppl/eval against mamba3_50m.yaml
# (BCNorm baseline) at matching tokens-seen + seed.
# =============================================================================

run:
  name: mamba3_50m_dysoftsign_finewebedu_1B
  out_dir: runs
  seed: 42
  log_every: 20
  eval_every: 500
  save_every: 1000
  wandb_project: nfmamba-baselines
  wandb_mode: online

model:
  arch: mamba3
  n_layers: 16
  d_model: 512
  d_state: 64
  expand: 2
  head_dim: 64
  ngroups: 1
  d_intermediate: 0
  vocab_size: 50257
  pad_vocab_multiple: 8
  tie_embeddings: true
  rms_norm: true
  residual_in_fp32: true
  fused_add_norm: true
  norm_epsilon: 1.0e-5
  initializer_range: 0.02

architecture:
  exponential_trapezoidal: true
  complex_ssm: true
  rope_fraction: 0.5
  bcnorm: false                   # documents the swap; actual install is via bc_stabilizer below
  bc_stabilizer: dysoftsign       # bcnorm | dysoftsign | dypower_p1 | dyt | dyisru | derf | identity
  stabilize_b: true
  stabilize_c: true
  squash_before_bias: false       # keep paper's order: projection -> squash -> bias -> RoPE -> SSD
  bc_bias: true
  short_conv: false
  is_outproj_norm: false
  is_mimo: false
  mimo_rank: 1

kernels:
  chunk_size: 128
  use_triton_siso: true           # SSD kernel is unchanged; squash is PyTorch element-wise
  use_cute_step: false

optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  fused: true

lr:
  peak: 6.0e-4
  min: 6.0e-5
  warmup_steps: 200
  schedule: cosine

training:
  total_tokens: 1_000_000_000
  batch_tokens: 524_288
  seq_len: 2048
  micro_batch_size: 8
  precision: bf16
  tf32: true
  compile: false                  # flip on once parity confirmed (inductor will fuse the squash)
  gradient_checkpointing: false

data:
  source: HuggingFaceFW/fineweb-edu
  source_config: sample-10BT
  split: train
  text_column: text
  streaming: true
  tokenizer: gpt2
  add_eos: true
  num_workers: 4
  prefetch_buffer: 8192
  shuffle_buffer: 10000

distributed:
  backend: nccl
  fsdp: false
  fsdp_sharding: full
  activation_checkpoint_every: 0

# -----------------------------------------------------------------------------
# BCNorm probes — instrumentation. The probe hooks the module currently bound
# to mixer.B_norm / mixer.C_norm, so DySoftSign activations are captured under
# the same metric names as BCNorm. This is what makes the ablation
# apples-to-apples in wandb.
# -----------------------------------------------------------------------------
probes:
  enabled: true
  log_every: 50
  hist_every: 200
  depth_plot_every: 200
  print_table_every: 200
  dump_raw_every: 1000
  dump_dir: probes
  hist_subsample: 10000
  track_grads: true               # log d(loss)/d(log_alpha), d(loss)/d(log_beta)

wandb:
  watch_model: true
  watch_log_freq: 200
  watch_log: all
  log_system_metrics: true
  save_checkpoints_as_artifacts: true
  tags: [ablation, mamba3, 50m, finewebedu, 1B, dysoftsign, normfree]
